services:
  hub:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - proofwire-data:/data
    environment:
      # Terminate TLS in front of this and set PROOFWIRE_TRUST_PROXY=1 there.
      # Without a proxy, leave it off: X-Forwarded-For is a header any client
      # can set, and trusting it would let anyone evade the rate limiter.
      PROOFWIRE_TRUST_PROXY: "0"
      PROOFWIRE_CHECKPOINT_EVERY: "500"
      PROOFWIRE_SELFCHECK_MINUTES: "60"
    restart: unless-stopped
    # The hub writes to /data and nowhere else.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # An independent witness. Run this somewhere the hub's operator does not
  # control — a different account, a different provider, ideally a different
  # company. A witness on the same host as the log it witnesses proves nothing
  # about that log that the log could not have claimed itself.
  witness:
    build: .
    ports:
      - "8788:8787"
    volumes:
      - proofwire-witness:/data
    environment:
      PROOFWIRE_CHECKPOINT_EVERY: "0"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  proofwire-data:
  proofwire-witness:
