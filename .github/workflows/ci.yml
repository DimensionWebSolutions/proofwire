name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the proxy spawns child processes and
        # that is where the platform differences bite — a .cmd shim needs a
        # shell, an interpreter path with a space must not have one.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22 resolves to the latest 22.x LTS, which is where `node:sqlite`
        # stopped needing --experimental-sqlite (22.13).
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund

      - name: Test
        run: npm test
        env:
          PROOFWIRE_ACCESS_LOG: 'off'
          PROOFWIRE_INSECURE_COOKIES: '1'

      - name: Demo
        run: npm run demo

  core-compat:
    # @proof_wire/core claims Node >= 20.11 and has no dependencies, including
    # no node:sqlite. An engine range nothing exercises is a guess, so this
    # runs the core and proxy suites on the oldest version they claim.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.11', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - name: Core and proxy only
        run: node --test packages/core/test/*.test.js packages/proxy/test/*.test.js

  verify-own-log:
    # Proofwire's own repository keeps a Proofwire log. If the project cannot
    # keep its own evidence intact, nothing else here is worth believing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Verify the committed log, if there is one
        run: |
          if [ -d .proofwire ]; then
            node packages/cli/src/bin.js verify
          else
            echo "no committed log yet — skipping"
          fi

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Load profile
        run: node --no-warnings=ExperimentalWarning packages/server/test/load.js
