name: Release

# Publishing from CI rather than a laptop, for three reasons that matter for a
# security product: the artifact is built from a tagged commit anyone can
# inspect, npm records provenance attestations linking each tarball to this
# workflow run, and no long-lived credential sits on a developer machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preflight only, publish nothing'
        type: boolean
        default: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
        env:
          PROOFWIRE_ACCESS_LOG: 'off'
          PROOFWIRE_INSECURE_COOKIES: '1'
      - run: npm run demo

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # write, because the last step creates the GitHub release.
      contents: write
      # Required for npm provenance: the tarball is signed against this run,
      # so anyone can check which commit and workflow produced it.
      id-token: write
    env:
      # Job-level so steps can branch on whether it exists. Without it, a
      # release is published from a maintainer's machine (`npm run release`,
      # with a 2FA code) and only then tagged; see docs/PUBLISHING.md.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --no-audit --no-fund

      - name: Confirm the tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package version $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        run: node scripts/release.js ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} --skip-tests
        env:
          # Attach provenance to every tarball.
          NPM_CONFIG_PROVENANCE: true

      - name: Or confirm it was already published by hand
        # A GitHub release says "this version exists"; it only gets made if
        # every package at the tagged version is genuinely on npm.
        if: env.NODE_AUTH_TOKEN == '' && startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          missing=0
          for p in packages/*/package.json; do
            [ "$(node -p "require('./$p').private === true")" = true ] && continue
            n="$(node -p "require('./$p').name")"
            if [ "$(npm view "$n@$V" version 2>/dev/null || true)" = "$V" ]; then
              echo "on npm: $n@$V"
            else
              echo "::error::$n@$V is not on npm"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            echo "::error::Publish $V first (npm run release), then push the tag — or add an NPM_TOKEN secret."
            exit 1
          fi

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, written by a person, over
          # notes generated from commit titles.
          awk -v v="$V" 'index($0, "## " v " ") == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Proofwire $V" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Proofwire $V" --generate-notes
          fi
