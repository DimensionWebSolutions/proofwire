# Keeps the SHA-pinned actions in .github/workflows current: each update
# arrives as a PR that CI must pass, with the new commit and its tag spelled
# out. The npm entry has nothing to do today (no dependencies), and exists so
# that the first one ever added is watched from the day it lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The Node base image in the Dockerfile, and the digest-pinned Caddy image
  # in deploy/compose.yml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
